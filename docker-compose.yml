services:
  app:
    build: .
    ports:
      - "${EXTERNAL_PORT}:${PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    environment:
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGHOST: ${PGHOST}
      PGDATABASE: ${PGDATABASE}
      PGPORT: ${PGPORT}
      SECRET_JWT_KEY: ${SECRET_JWT_KEY}
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - db
      - mongo
      - redis

  db:
    image: postgres
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${EXTERNAL_PGPORT}:${PGPORT}"

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
